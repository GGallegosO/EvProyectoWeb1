<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header class="main-header">
        <h1>Estación Arcade - Tu entretención Total</h1>

    </header>
    <main>
        <section class="video-container">
            <h3>Juegos de la semana</h3>
            <div class="video-grid">
                <div class="video-card">
                    <video width="100%" controls>
                        <source src="paginas/videos/ps5.mp4" type="video/mp4">
                    </video>
                    <p>Consola PS5</p>
                </div>

                <div class="video-card">
                    <video width="100%" controls>
                        <source src="paginas/videos/nintendo.mp4" type="video/mp4">
                    </video>
                    <p>Nintendo</p>
                </div>

                <div class="video-card">
                    <iframe width="100%" height="200" src="https://www.youtube.com/embed?v=vy4TsXf1cyM"
                        title="Unboxing ROG Ally X" frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen>
                    </iframe>
                    <p>Unboxing xbox</p>
                </div>


            </div>
        </section>

        <section class="products-container">

            <h3>Nuestros Productos</h3>
            <div class="product-grid">
                <div class="product-card">
                    <img src="img/consola_ps5.jpeg" alt="Consola PS5">
                    <div class="product-info">
                        <h4>Consola Play Station5</h4>
                        <p class="price">$800.000</p>
                        <button class="buy-btn">Añadir al carro</button>
                    </div>
                </div>


                <div class="product-card">
                    <img src="img/Control_xbox.jpeg" alt="Control Xbox">
                    <div class="product-info">
                        <h4>Control Xbox</h4>
                        <p class="price">$90.000</p>
                        <button class="buy-btn">Añadir al carro</button>
                    </div>
                </div>

                <div class="product-card">
                    <img src="img/audifonos_gpro.jpeg" alt="Audífonos Gamer">
                    <div class="product-info">
                        <h4>Audífonos Gamer</h4>
                        <p class="price">$68.000</p>
                        <button class="buy-btn">Añadir al carro</button>
                    </div>
                </div>
            </div>

        </section>

        <section class="contact-container" id="contacto">
            <h3>Contacto</h3>
            <div class="contact-form-wrapper">
                <form action="agradecimientos.html" method="GET">
                    <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre..." required>
                    </div>

                    <div class="form-group">
                        <label for="apellido">Apellido:</label>
                        <input type="text" id="apellido" name="apellido" placeholder="Tu apellido..." required>
                    </div>

                    <div class="form-group">
                        <label for="email">Correo electrónico:</label>
                        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                    </div>

                    <div class="form-group">
                        <label for="mensaje">Mensaje:</label>
                        <textarea id="mensaje" name="mensaje" rows="4"
                            placeholder="¿En qué podemos ayudarte?"></textarea>
                    </div>

                    <button type="submit" class="send-btn">Enviar Mensaje</button>
                </form>
            </div>
        </section>

    </main>

    <footer>
        <p>Todos los derechso reservados</p>
    </footer>

</body>

</html>
