<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header class="main-header">
        <h1>Estación Arcade - Tu entretención Total</h1>

    </header>
    <main>
        <section class="video-container">
            <h3>Juegos de la semana</h3>
            <div class="video-grid">
                <a href="https://www.youtube.com/watch?v=RkC0l4iekYo" target="_blank" class="video-card">
                    <img src="https://img.youtube.com/vi/RkC0l4iekYo/maxresdefault.jpg" alt="Miniatura Video 1">
                    <p>Estación Arcade PS5</p>
                </a>

                <a href="https://www.youtube.com/watch?v=0QeqO0kFz-E" target="_blank" class="video-card">
                    <img src="https://img.youtube.com/vi/0QeqO0kFz-E/maxresdefault.jpg" alt="Miniatura Video 2">
                    <p>Gameplay Pro</p>
                </a>

                <a href="https://www.youtube.com/watch?v=FIVmyOIV1MQ" target="_blank" class="video-card">
                    <img src="https://img.youtube.com/vi/FIVmyOIV1MQ/maxresdefault.jpg" alt="Miniatura Video 3">
                    <p>Unboxing Especial</p>
                </a>
            </div>
        </section>

        <section class="products-container">

            <h3>Nuestros Productos</h3>
            <div class="product-grid">
                <div class="product-card">
                    <img src="img/consola_ps5.jpeg" alt="Consola PS5">
                    <div class="product-info">
                        <h4>Consola Play Station5</h4>
                        <p class="price">$800.000</p>
                        <button class="buy-btn">Añadir al carro</button>
                    </div>
                </div>


                <div class="product-card">
                    <img src="img/Control_xbox.jpeg" alt="Control Xbox">
                    <div class="product-info">
                        <h4>Control Xbox</h4>
                        <p class="price">$90.000</p>
                        <button class="buy-btn">Añadir al carro</button>
                    </div>
                </div>

                <div class="product-card">
                    <img src="img/audifonos_gpro.jpeg" alt="Audífonos Gamer">
                    <div class="product-info">
                        <h4>Audífonos Gamer</h4>
                        <p class="price">$68.000</p>
                        <button class="buy-btn">Añadir al carro</button>
                    </div>
                </div>
            </div>

        </section>
    </main>

    <footer>
        <p>Todos los derechso reservados</p>
    </footer>

</body>

</html>
